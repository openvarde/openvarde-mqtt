services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: openvarde-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log

    networks:
      - openvarde

networks:
  openvarde:
    external: true
